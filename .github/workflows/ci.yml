name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      # A snapshot, not apt's 2021.01: the converted examples are one cube per
      # pixel, and 2021.01's CGAL renderer does not finish them in minutes.
      # The snapshot renders them in seconds with Manifold.
      - name: Install OpenSCAD snapshot and just
        # The AppImage and its checksum; update both together.
        env:
          OPENSCAD_SNAPSHOT: OpenSCAD-2026.08.19-x86_64.AppImage
          OPENSCAD_SHA256: fdd818025e890f465ffacffbe7d0c6fa3ebeb3f7c18ee860a909ab41396be643
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends just libegl1 libgl1 libopengl0 libfontconfig1 libharfbuzz0b
          curl -fSL -o "$RUNNER_TEMP/openscad.AppImage" "https://files.openscad.org/snapshots/${OPENSCAD_SNAPSHOT}"
          echo "${OPENSCAD_SHA256}  ${RUNNER_TEMP}/openscad.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/openscad.AppImage"
          printf '#!/bin/sh\nexec %s --appimage-extract-and-run "$@"\n' "$RUNNER_TEMP/openscad.AppImage" | sudo tee /usr/local/bin/openscad > /dev/null
          sudo chmod +x /usr/local/bin/openscad
          openscad --version

      # topiary formats the .scad sources, and its version decides its output, so it
      # is pinned by digest. Bump it with workstation-configs' apps/topiary.
      - name: Install topiary
        run: |
          name=topiary-cli-x86_64-unknown-linux-gnu
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/tweag/topiary/releases/download/v0.8.0/$name.tar.xz"
          echo "42e54ff151dd6b20621166a09e3a5df2b367a108799900c3adbfc9c10dc93aa1  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/$name/topiary" /usr/local/bin/topiary
          topiary prefetch openscad

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: just setup
      - run: just check
      - run: just test
