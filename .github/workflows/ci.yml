name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Pinned: noble's apt OpenSCAD is 2021.01, the oldest release the
    # examples are rendered on.
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenSCAD and just
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad just
          openscad --version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: just setup
      - run: just check
      - run: just test
